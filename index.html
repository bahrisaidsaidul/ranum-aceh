<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RANUM — Aceh Nature &amp; Halal Journey</title>
  <meta name="description" content="Discover Aceh Naturally, Travel Comfortably. Platform digital pariwisata alam, budaya, kuliner halal, dan akomodasi ramah Muslim di Aceh." />
  <meta name="theme-color" content="#344C3D" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

  <!-- Google Fonts: Fraunces (Soft Optical Serif) & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,SOFT,wght@0,9..144,100,400;0,9..144,100,500;0,9..144,100,600;1,9..144,100,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Scroll Progress Bar (GSAP) -->
  <div class="scroll-progress-bar" id="scrollProgressBar" aria-hidden="true"></div>

  <!-- Sticky Glassmorphic Navigation Header -->
  <header class="site-header" id="siteHeader">
    <div class="container nav-inner">
      <a href="#home" class="brand-logo" data-route="home" aria-label="RANUM Home">
        <span class="brand-mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3C7 7 5 11.5 5 15a7 7 0 0 0 14 0c0-3.5-2-8-7-12Z"/>
            <path d="M12 22V11"/>
            <path d="M12 15l3-2.5"/>
            <path d="M12 17l-3-2.5"/>
          </svg>
        </span>
        <span class="brand-text">RANUM</span>
      </a>

      <nav aria-label="Main Navigation">
        <ul class="nav-links" id="desktopNav"></ul>
      </nav>

      <div class="nav-actions">
        <div class="lang-toggle" role="group" aria-label="Language Switcher">
          <button type="button" class="lang-btn" data-lang="id">ID</button>
          <button type="button" class="lang-btn" data-lang="en">EN</button>
        </div>

        <div id="navAuthArea" class="nav-auth-area desktop-only"></div>

        <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle Menu" aria-expanded="false">
          <span class="hamburger-box" aria-hidden="true">
            <span class="hamburger-line line-1"></span>
            <span class="hamburger-line line-2"></span>
            <span class="hamburger-line line-3"></span>
          </span>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile Navigation Drawer -->
  <div class="mobile-drawer" id="mobileDrawer" aria-hidden="true">
    <div id="mobileUserCard" class="mobile-user-card"></div>
    <ul class="mobile-nav-list" id="mobileNav"></ul>
  </div>

  <!-- Main SPA View Mount -->
  <main id="app" aria-live="polite"></main>

  <!-- Footer -->
  <footer class="site-footer" id="siteFooter"></footer>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="mobile-bottom-nav" id="mobileBottomNav" aria-label="Mobile Bottom Navigation"></nav>

  <!-- Reusable Glassmorphic Modal -->
  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-box" data-lenis-prevent>
      <div class="modal-header">
        <h3 id="modalTitle" style="font-size:1.45rem;"></h3>
        <button type="button" class="btn btn-icon btn-outline" id="modalCloseBtn" aria-label="Close modal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Toast Notifications -->
  <div class="toast-container" id="toastContainer" aria-live="assertive"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
